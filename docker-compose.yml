services:
  telegram-imagebed:
    build: .
    image: telegram-imagebed:latest
    container_name: telegram-imagebed
    ports:
      - "127.0.0.1:18793:18793"
    volumes:
      - ./data:/app/data
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18793/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 项目名称（避免中文路径问题）
name: telegram-imagebed
